<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AbhiAI Offline</title><style>body{font:16px system-ui;background:#101522;color:#eee;padding:24px}article{white-space:pre-wrap;overflow-wrap:anywhere;border-bottom:1px solid #555;padding:12px}button{padding:10px}</style><h1>AbhiAI · Offline</h1><p>Saved chats on this device. AI replies require internet.</p><button onclick="location.reload()">Retry connection</button><main id="history"></main><script>const root=document.getElementById('history');const req=indexedDB.open('abhiai-local',1);req.onupgradeneeded=()=>req.result.createObjectStore('chats',{keyPath:'id'});req.onerror=()=>root.textContent='History unavailable';req.onsuccess=()=>{const db=req.result;const tx=db.transaction('chats','readonly');const read=tx.objectStore('chats').getAll();read.onsuccess=()=>{for(const c of read.result.sort((a,b)=>b.updatedAt-a.updatedAt)){const d=document.createElement('details'),s=document.createElement('summary');s.textContent=c.title;d.append(s);for(const m of c.messages||[]){const a=document.createElement('article');a.textContent=m.role+': '+m.content;d.append(a)}root.append(d)}if(!read.result.length)root.textContent='No saved chats'};tx.oncomplete=()=>db.close();tx.onerror=()=>root.textContent='History unavailable'};</script></html>
